<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifePlanner">
<title>LifePlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #161b27;
  --bg3: #1e2535;
  --bg4: #252d3d;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8eaf0;
  --text2: #8b93a8;
  --text3: #5a6278;
  --accent: #4f8ef7;
  --accent2: #3a7ae8;
  --accent-glow: rgba(79,142,247,0.18);
  --green: #34c97a;
  --green-bg: rgba(52,201,122,0.12);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.12);
  --red: #ff5f5f;
  --red-bg: rgba(255,95,95,0.12);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.12);
  --teal: #2dd4bf;
  --teal-bg: rgba(45,212,191,0.12);
  --coral: #f87171;
  --coral-bg: rgba(248,113,113,0.12);
  --radius: 8px;
  --radius-lg: 12px;
  --font: 'Noto Sans JP', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --header-h: 52px;
  --cal-header-h: 44px;
  --time-col-w: 38px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: var(--font); }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── APP SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
#top-bar {
  flex-shrink: 0;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  z-index: 100;
  overflow: hidden;
}
#app-title {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--accent);
  font-family: var(--font-mono);
  white-space: nowrap;
}
#date-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 8px;
}
#date-nav button {
  width: 26px; height: 26px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
#date-nav button:hover { background: var(--bg4); color: var(--text); }
#current-date-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  min-width: 110px;
  text-align: center;
}
#today-btn {
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
  transition: all .15s;
}
#today-btn:hover { background: var(--bg4); color: var(--text); }

/* quick log buttons in top bar */
.quick-log-area {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.quick-log-area .ql-label {
  font-size: 11px;
  color: var(--text3);
  margin-right: 2px;
}
.ql-btn {
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border2);
  color: var(--text2);
  background: var(--bg3);
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.ql-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.ql-btn.wake  { border-color: rgba(245,166,35,0.4); color: var(--amber); background: var(--amber-bg); }
.ql-btn.enter { border-color: rgba(52,201,122,0.4); color: var(--green); background: var(--green-bg); }
.ql-btn.leave { border-color: rgba(248,113,113,0.4); color: var(--coral); background: var(--coral-bg); }
.ql-btn.home  { border-color: rgba(167,139,250,0.4); color: var(--purple); background: var(--purple-bg); }

/* ── MAIN LAYOUT ── */
#main {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}
#left-panel {
  flex: 0 0 70%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--border);
}
#right-panel {
  flex: 0 0 30%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg2);
}

/* ── CAL HEADER ── */
#cal-header {
  flex-shrink: 0;
  height: var(--cal-header-h);
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.view-tabs {
  display: flex;
  background: var(--bg3);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.view-tab {
  padding: 5px 14px;
  border-radius: calc(var(--radius) - 2px);
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  transition: all .15s;
}
.view-tab.active {
  background: var(--accent);
  color: #fff;
}
.view-tab:hover:not(.active) { color: var(--text); }
#add-event-btn {
  margin-left: auto;
  padding: 5px 12px;
  border-radius: var(--radius);
  background: var(--accent-glow);
  border: 1px solid rgba(79,142,247,0.3);
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
  transition: all .15s;
}
#add-event-btn:hover { background: var(--accent); color: #fff; }

/* ── CALENDAR BODY ── */
#cal-body {
  flex: 1;
  overflow: hidden;
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── WEEKLY VIEW ── */
#weekly-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.week-day-headers {
  flex-shrink: 0;
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.week-day-headers .time-gutter {
  flex: 0 0 var(--time-col-w);
  border-right: 1px solid var(--border);
}
.week-day-col-header {
  flex: 1;
  text-align: center;
  padding: 5px 4px;
  font-size: 11px;
  color: var(--text3);
  border-right: 1px solid var(--border);
  line-height: 1.4;
}
.week-day-col-header .day-num {
  font-size: 16px;
  font-weight: 700;
  color: var(--text2);
  display: block;
}
.week-day-col-header.today .day-num {
  color: #fff;
  background: var(--accent);
  border-radius: 50%;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
}
.week-day-col-header.today { color: var(--accent); }
.week-day-col-header:last-child { border-right: none; }
.week-scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.week-grid {
  display: flex;
  position: relative;
}
.time-gutter-col {
  flex: 0 0 var(--time-col-w);
  border-right: 1px solid var(--border);
  position: relative;
}
.time-label {
  position: absolute;
  right: 4px;
  font-size: 9px;
  color: var(--text3);
  font-family: var(--font-mono);
  transform: translateY(-50%);
  white-space: nowrap;
}
.week-days-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  position: relative;
  overflow: visible;
}
.week-day-lane {
  border-right: 1px solid var(--border);
  position: relative;
  overflow: visible;
}
.week-day-lane:last-child { border-right: none; }
.hour-row {
  border-bottom: 1px solid var(--border);
  position: relative;
}
.half-line {
  position: absolute;
  bottom: 50%;
  left: 0; right: 0;
  border-bottom: 1px dashed var(--border);
  pointer-events: none;
}
.current-time-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: var(--red);
  z-index: 10;
  pointer-events: none;
}
.current-time-line::before {
  content: '';
  position: absolute;
  left: -4px; top: -3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
}

/* ── 1DAY VIEW ── */
#day-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.day-view-header {
  flex-shrink: 0;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  font-size: 12px;
  color: var(--text2);
}
.day-scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.day-grid {
  display: flex;
  position: relative;
}
.day-time-col {
  flex: 0 0 48px;
  border-right: 1px solid var(--border);
  position: relative;
}
.day-events-col {
  flex: 1;
  position: relative;
  overflow: visible;
}

/* ── MONTHLY VIEW ── */
#month-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.month-day-labels {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.month-day-label {
  text-align: center;
  padding: 6px;
  font-size: 11px;
  color: var(--text3);
}
.month-grid-wrap {
  flex: 1;
  overflow: auto;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  height: 100%;
}
.month-cell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 6px;
  min-height: 80px;
  cursor: pointer;
  transition: background .15s;
}
.month-cell:hover { background: var(--bg3); }
.month-cell.today { background: var(--accent-glow); }
.month-cell.other-month .mc-num { color: var(--text3); }
.mc-num {
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 4px;
}
.month-cell.today .mc-num {
  color: #fff;
  background: var(--accent);
  border-radius: 50%;
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
}
.mc-events { display: flex; flex-direction: column; gap: 2px; }
.mc-event-dot {
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── EVENTS on grid ── */
.cal-event {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: 5px;
  padding: 2px 5px;
  font-size: 10px;
  overflow: hidden;
  cursor: pointer;
  z-index: 2;
  transition: opacity .15s;
  border-left: 3px solid transparent;
}
.cal-event:hover { opacity: 0.85; }
.cal-event .ev-title { font-weight: 500; }
.cal-event .ev-time { color: rgba(255,255,255,0.65); font-size: 9px; font-family: var(--font-mono); }

/* log chip */
.log-chip {
  position: absolute;
  left: 0; right: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px;
  z-index: 3;
  pointer-events: none;
}
.log-chip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.log-chip-text {
  font-size: 9px;
  font-family: var(--font-mono);
  font-weight: 500;
}

/* ── RIGHT PANEL ── */
.panel-section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 1px solid var(--border);
}
.panel-section:last-child { border-bottom: none; flex: 1; }
.panel-section-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
}
.panel-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
}
.panel-add-btn {
  margin-left: auto;
  width: 22px; height: 22px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
  transition: all .15s;
}
.panel-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
}

/* ── GOAL LIST ── */
.goal-item {
  margin-bottom: 10px;
}
.goal-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg3);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
}
.goal-title-row:hover { background: var(--bg4); }
.goal-color-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.goal-name {
  flex: 1;
  font-size: 12px;
  font-weight: 500;
}
.goal-chevron {
  font-size: 10px;
  color: var(--text3);
  transition: transform .2s;
}
.goal-item.expanded .goal-chevron { transform: rotate(90deg); }
.goal-subtasks {
  display: none;
  padding: 4px 0 0 16px;
}
.goal-item.expanded .goal-subtasks { display: block; }
.subtask-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s;
}
.subtask-row:hover { background: var(--bg3); }
.subtask-check {
  width: 14px; height: 14px;
  border-radius: 3px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.subtask-row.done .subtask-check {
  background: var(--green);
  border-color: var(--green);
}
.subtask-row.done .subtask-check::after {
  content: '✓';
  font-size: 9px;
  color: #000;
}
.subtask-label {
  font-size: 11px;
  color: var(--text2);
  flex: 1;
}
.subtask-row.done .subtask-label { text-decoration: line-through; color: var(--text3); }
.subtask-del { color: var(--text3); font-size: 14px; opacity: 0; transition: opacity .15s; }
.subtask-row:hover .subtask-del { opacity: 1; }

/* ── TODO LIST ── */
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 5px 6px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s;
  margin-bottom: 2px;
}
.todo-item:hover { background: var(--bg3); }
.todo-check {
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.todo-item.done .todo-check {
  background: var(--green);
  border-color: var(--green);
}
.todo-item.done .todo-check::after {
  content: '✓';
  font-size: 8px;
  color: #000;
}
.todo-text {
  flex: 1;
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
}
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
.todo-del { color: var(--text3); font-size: 14px; opacity: 0; transition: opacity .15s; }
.todo-item:hover .todo-del { opacity: 1; }
.priority-badge {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 10px;
  flex-shrink: 0;
  align-self: center;
}
.p-high { background: var(--red-bg); color: var(--red); }
.p-mid  { background: var(--amber-bg); color: var(--amber); }
.p-low  { background: var(--green-bg); color: var(--green); }

/* ── LOG LIST (bottom of right panel) ── */
.log-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 5px;
  margin-bottom: 2px;
}
.log-time {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--accent);
  min-width: 36px;
}
.log-type-badge {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 10px;
}

/* ── MODALS ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 360px;
  max-width: 95vw;
}
.modal-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}
.form-row {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 4px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  outline: none;
  transition: border .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-select option { background: var(--bg3); }
.form-textarea { resize: vertical; min-height: 60px; }
.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch {
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border .15s;
}
.color-swatch.selected { border-color: #fff; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn-cancel {
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
  transition: all .15s;
}
.btn-cancel:hover { background: var(--bg3); }
.btn-save {
  padding: 6px 16px;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  transition: background .15s;
}
.btn-save:hover { background: var(--accent2); }
.btn-danger {
  padding: 6px 12px;
  border-radius: var(--radius);
  background: var(--red-bg);
  border: 1px solid rgba(255,95,95,0.3);
  color: var(--red);
  font-size: 12px;
  transition: all .15s;
}
.btn-danger:hover { background: var(--red); color: #fff; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 12px;
  color: var(--text);
  z-index: 300;
  transition: transform .25s ease;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── PRIORITY INLINE FORM ── */
.inline-form {
  display: flex;
  gap: 6px;
  padding: 6px 4px;
  margin-bottom: 4px;
}
.inline-input {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  padding: 5px 9px;
  font-size: 12px;
  outline: none;
}
.inline-input:focus { border-color: var(--accent); }
.inline-select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text2);
  padding: 5px;
  font-size: 11px;
  outline: none;
}
.inline-add-btn {
  padding: 5px 10px;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  transition: background .15s;
}
.inline-add-btn:hover { background: var(--accent2); }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="top-bar">
    <span id="app-title">LifePlanner</span>

    <div id="date-nav">
      <button id="prev-btn" title="前へ">&#8249;</button>
      <span id="current-date-label"></span>
      <button id="next-btn" title="次へ">&#8250;</button>
      <button id="today-btn">今日</button>
    </div>

    <div class="quick-log-area">
      <span class="ql-label">瞬間ログ:</span>
      <button class="ql-btn wake"  data-logtype="起床">☀ 起床</button>
      <button class="ql-btn enter" data-logtype="入店">→ 入店</button>
      <button class="ql-btn leave" data-logtype="退店">← 退店</button>
      <button class="ql-btn home"  data-logtype="帰宅">⌂ 帰宅</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- LEFT: CALENDAR -->
    <div id="left-panel">
      <div id="cal-header">
        <div class="view-tabs">
          <button class="view-tab" data-view="day">1Day</button>
          <button class="view-tab active" data-view="week">Weekly</button>
          <button class="view-tab" data-view="month">Monthly</button>
        </div>
        <button id="add-event-btn">＋ 予定を追加</button>
      </div>
      <div id="cal-body">
        <!-- views injected by JS -->
      </div>
    </div>

    <!-- RIGHT: TODO + LOGS -->
    <div id="right-panel">

      <!-- GOALS / BIG TODO -->
      <div class="panel-section" style="flex:1.2">
        <div class="panel-section-header">
          <span class="panel-section-title">🎯 大ゴール &amp; ToDo</span>
          <button class="panel-add-btn" id="add-goal-btn" title="ゴール追加">＋</button>
        </div>
        <div class="panel-scroll" id="goal-list-wrap"></div>
      </div>

      <!-- DAILY TODO -->
      <div class="panel-section" style="flex:1">
        <div class="panel-section-header">
          <span class="panel-section-title">⚡ 今日のToDo</span>
          <button class="panel-add-btn" id="show-todo-form-btn" title="ToDo追加">＋</button>
        </div>
        <div class="panel-scroll" id="todo-wrap">
          <div class="inline-form" id="todo-inline-form" style="display:none">
            <input class="inline-input" id="todo-input-text" placeholder="タスクを入力..." />
            <select class="inline-select" id="todo-priority-sel">
              <option value="high">高</option>
              <option value="mid" selected>中</option>
              <option value="low">低</option>
            </select>
            <button class="inline-add-btn" id="todo-inline-add">追加</button>
          </div>
          <div id="todo-list"></div>
        </div>
      </div>

      <!-- LOG PANEL -->
      <div class="panel-section" style="flex:0.7; border-bottom:none;">
        <div class="panel-section-header">
          <span class="panel-section-title">📌 今日のログ</span>
        </div>
        <div class="panel-scroll" id="log-list-wrap"></div>
      </div>

    </div>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="modal-overlay hidden" id="event-modal">
  <div class="modal-box">
    <div class="modal-title" id="event-modal-title">予定を追加</div>
    <div class="form-row">
      <label class="form-label">タイトル</label>
      <input class="form-input" id="ev-title" placeholder="例：クライアントMTG" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <label class="form-label">日付</label>
        <input class="form-input" type="date" id="ev-date" />
      </div>
      <div class="form-row">
        <label class="form-label">色</label>
        <div class="color-swatches" id="ev-color-swatches"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <label class="form-label">開始時刻</label>
        <input class="form-input" type="time" id="ev-start" value="09:00" />
      </div>
      <div class="form-row">
        <label class="form-label">終了時刻</label>
        <input class="form-input" type="time" id="ev-end" value="10:00" />
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">メモ</label>
      <textarea class="form-textarea" id="ev-memo" placeholder="メモ（任意）"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-danger hidden" id="ev-delete-btn">削除</button>
      <button class="btn-cancel" id="ev-cancel-btn">キャンセル</button>
      <button class="btn-save" id="ev-save-btn">保存</button>
    </div>
  </div>
</div>

<!-- GOAL MODAL -->
<div class="modal-overlay hidden" id="goal-modal">
  <div class="modal-box">
    <div class="modal-title">ゴールを追加</div>
    <div class="form-row">
      <label class="form-label">ゴール名</label>
      <input class="form-input" id="goal-name-input" placeholder="例：税理士として独立開業" />
    </div>
    <div class="form-row">
      <label class="form-label">テーマカラー</label>
      <div class="color-swatches" id="goal-color-swatches"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="goal-cancel-btn">キャンセル</button>
      <button class="btn-save" id="goal-save-btn">追加</button>
    </div>
  </div>
</div>

<!-- SUBTASK MODAL -->
<div class="modal-overlay hidden" id="subtask-modal">
  <div class="modal-box">
    <div class="modal-title" id="subtask-modal-title">サブタスクを追加</div>
    <div class="form-row">
      <label class="form-label">タスク名</label>
      <input class="form-input" id="subtask-input" placeholder="例：顧客対応フローを整備する" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="subtask-cancel-btn">キャンセル</button>
      <button class="btn-save" id="subtask-save-btn">追加</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt2 = n => String(n).padStart(2,'0');
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${fmt2(d.getMonth()+1)}-${fmt2(d.getDate())}`;
};
const parseDate = s => {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
};
const fmtDateJP = d => {
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
};
const fmtDateFull = d => {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
};
const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = m => `${fmt2(Math.floor(m/60))}:${fmt2(m%60)}`;
const nowTimeStr = () => {
  const n = new Date();
  return `${fmt2(n.getHours())}:${fmt2(n.getMinutes())}`;
};

// ─────────────────────────────────────────────
//  COLORS
// ─────────────────────────────────────────────
const EVENT_COLORS = [
  { bg: '#1d5fa4', border: '#4f8ef7', text: '#b5d4f4', label: 'ブルー' },
  { bg: '#1a6b47', border: '#34c97a', text: '#9fe1cb', label: 'グリーン' },
  { bg: '#7a3a8a', border: '#a78bfa', text: '#d4bbfc', label: 'パープル' },
  { bg: '#8a3a1a', border: '#f87171', text: '#fca5a5', label: 'コーラル' },
  { bg: '#8a5a0a', border: '#f5a623', text: '#fcd34d', label: 'アンバー' },
  { bg: '#1a6a70', border: '#2dd4bf', text: '#99f6e4', label: 'ティール' },
  { bg: '#3a3a5a', border: '#818cf8', text: '#c7d2fe', label: 'インディゴ' },
];
const LOG_COLORS = {
  '起床': { dot: '#f5a623', badge_bg: 'rgba(245,166,35,0.15)', badge_text: '#f5a623' },
  '入店': { dot: '#34c97a', badge_bg: 'rgba(52,201,122,0.15)', badge_text: '#34c97a' },
  '退店': { dot: '#f87171', badge_bg: 'rgba(248,113,113,0.15)', badge_text: '#f87171' },
  '帰宅': { dot: '#a78bfa', badge_bg: 'rgba(167,139,250,0.15)', badge_text: '#a78bfa' },
};

// ─────────────────────────────────────────────
//  STATE & STORAGE
// ─────────────────────────────────────────────
const LS = {
  get: (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let state = {
  view: 'week',
  currentDate: todayStr(),
  events: LS.get('lp_events', []),
  goals: LS.get('lp_goals', []),
  todos: LS.get('lp_todos', []),
  logs: LS.get('lp_logs', []),
};
const save = () => {
  LS.set('lp_events', state.events);
  LS.set('lp_goals', state.goals);
  LS.set('lp_todos', state.todos);
  LS.set('lp_logs', state.logs);
};
const genId = () => Math.random().toString(36).slice(2,9);

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────────
//  DATE NAV
// ─────────────────────────────────────────────
function updateDateLabel() {
  const d = parseDate(state.currentDate);
  const v = state.view;
  if (v === 'day') {
    $('current-date-label').textContent = fmtDateJP(d);
  } else if (v === 'week') {
    const mon = getWeekStart(d);
    const sun = new Date(mon); sun.setDate(sun.getDate()+6);
    $('current-date-label').textContent = `${mon.getMonth()+1}/${mon.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}`;
  } else {
    $('current-date-label').textContent = `${d.getFullYear()}年${d.getMonth()+1}月`;
  }
}
function getWeekStart(d) {
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return mon;
}
function navigate(dir) {
  const d = parseDate(state.currentDate);
  if (state.view === 'day') d.setDate(d.getDate() + dir);
  else if (state.view === 'week') d.setDate(d.getDate() + dir*7);
  else d.setMonth(d.getMonth() + dir);
  state.currentDate = `${d.getFullYear()}-${fmt2(d.getMonth()+1)}-${fmt2(d.getDate())}`;
  renderAll();
}
$('prev-btn').onclick = () => navigate(-1);
$('next-btn').onclick = () => navigate(1);
$('today-btn').onclick = () => { state.currentDate = todayStr(); renderAll(); };

// ─────────────────────────────────────────────
//  VIEW TABS
// ─────────────────────────────────────────────
document.querySelectorAll('.view-tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    renderCalendar();
    updateDateLabel();
  };
});

// ─────────────────────────────────────────────
//  CALENDAR RENDER DISPATCH
// ─────────────────────────────────────────────
function renderCalendar() {
  const body = $('cal-body');
  body.innerHTML = '';
  if (state.view === 'week') renderWeekView(body);
  else if (state.view === 'day') renderDayView(body);
  else renderMonthView(body);
}

// ─────────────────────────────────────────────
//  HOUR HEIGHT
//  固定48px：スクロールで全24時間を確実に表示
//  (24h × 48px = 1152px のグリッドを縦スクロール)
// ─────────────────────────────────────────────
const HOUR_H = 48;
function getHourH() {
  return HOUR_H;
}

// ─────────────────────────────────────────────
//  WEEKLY VIEW
// ─────────────────────────────────────────────
function renderWeekView(container) {
  const hourH = getHourH();
  const d = parseDate(state.currentDate);
  const mon = getWeekStart(d);
  const days = Array.from({length:7}, (_,i) => { const dd = new Date(mon); dd.setDate(mon.getDate()+i); return dd; });
  const today = todayStr();
  const DAY_NAMES = ['月','火','水','木','金','土','日'];

  const wrap = document.createElement('div');
  wrap.id = 'weekly-view';
  wrap.innerHTML = `
    <div class="week-day-headers">
      <div class="time-gutter"></div>
      ${days.map((dd,i) => {
        const ds = `${dd.getFullYear()}-${fmt2(dd.getMonth()+1)}-${fmt2(dd.getDate())}`;
        const isToday = ds === today;
        const isSat = i === 5, isSun = i === 6;
        const color = isSun ? 'color:var(--red);' : isSat ? 'color:var(--accent);' : '';
        return `<div class="week-day-col-header${isToday?' today':''}" style="${color}" data-date="${ds}">
          <span class="day-num">${dd.getDate()}</span>
          <span>${DAY_NAMES[i]}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="week-scroll-area" id="week-scroll">
      <div class="week-grid" id="week-grid" style="height:${hourH*24}px">
        <div class="time-gutter-col" id="time-gutter-col"></div>
        <div class="week-days-grid" id="week-days-grid"></div>
      </div>
    </div>`;
  container.appendChild(wrap);

  // time labels + hour rows
  const gutterCol = wrap.querySelector('#time-gutter-col');
  for (let h = 0; h < 24; h++) {
    const lbl = document.createElement('div');
    lbl.className = 'time-label';
    lbl.style.top = `${h * hourH + hourH/2}px`;
    lbl.textContent = `${fmt2(h)}:00`;
    gutterCol.appendChild(lbl);
  }

  const daysGrid = wrap.querySelector('#week-days-grid');
  days.forEach((dd, di) => {
    const ds = `${dd.getFullYear()}-${fmt2(dd.getMonth()+1)}-${fmt2(dd.getDate())}`;
    const lane = document.createElement('div');
    lane.className = 'week-day-lane';
    lane.style.height = `${hourH*24}px`;
    lane.dataset.date = ds;

    for (let h = 0; h < 24; h++) {
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.style.height = `${hourH}px`;
      row.style.top = `${h*hourH}px`;
      row.style.position = 'absolute';
      row.style.left = '0'; row.style.right = '0';
      const half = document.createElement('div');
      half.className = 'half-line';
      row.appendChild(half);
      lane.appendChild(row);
    }

    // click to add
    lane.addEventListener('click', e => {
      if (e.target.closest('.cal-event') || e.target.closest('.log-chip')) return;
      const rect = lane.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const hh = Math.floor(y / hourH);
      const mm = (y % hourH) >= hourH/2 ? 30 : 0;
      openEventModal(null, ds, `${fmt2(hh)}:${fmt2(mm)}`, `${fmt2(Math.min(hh+1,23))}:${fmt2(mm)}`);
    });

    daysGrid.appendChild(lane);

    // events
    const dayEvents = state.events.filter(ev => ev.date === ds);
    renderEventsInLane(lane, dayEvents, hourH, false);

    // logs
    const todayLogs = state.logs.filter(lg => lg.date === ds);
    renderLogsInLane(lane, todayLogs, hourH);
  });

  // current time line — week-days-grid全体に対してabsoluteで描画
  // (Chromeでdisplay:gridの子にabsoluteが正しく機能しない問題を回避)
  const now = new Date();
  const nowDs = `${now.getFullYear()}-${fmt2(now.getMonth()+1)}-${fmt2(now.getDate())}`;
  const todayIndex = days.findIndex(dd => {
    const ds = `${dd.getFullYear()}-${fmt2(dd.getMonth()+1)}-${fmt2(dd.getDate())}`;
    return ds === nowDs;
  });
  if (todayIndex >= 0) {
    const minOfDay = now.getHours()*60 + now.getMinutes();
    const topPx = (minOfDay / 60) * hourH;
    // グリッド全体（7列）に対して横幅を1/7に計算して位置を合わせる
    const pct = (todayIndex / 7) * 100;
    const line = document.createElement('div');
    line.className = 'current-time-line';
    line.style.top = `${topPx}px`;
    line.style.left = `${pct}%`;
    line.style.right = `${100 - pct - (100/7)}%`;
    daysGrid.appendChild(line);
  }

  // scroll to 7am
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const scrollArea = wrap.querySelector('#week-scroll');
      if (scrollArea) scrollArea.scrollTop = hourH * 7;
    });
  });
}

// ─────────────────────────────────────────────
//  1DAY VIEW
// ─────────────────────────────────────────────
function renderDayView(container) {
  const hourH = getHourH();
  const ds = state.currentDate;

  const wrap = document.createElement('div');
  wrap.id = 'day-view';
  wrap.innerHTML = `
    <div class="day-view-header">${fmtDateFull(parseDate(ds))}（${['日','月','火','水','木','金','土'][parseDate(ds).getDay()]}）</div>
    <div class="day-scroll-area" id="day-scroll">
      <div class="day-grid" style="height:${hourH*24}px">
        <div class="day-time-col" id="day-time-col"></div>
        <div class="day-events-col" id="day-events-col" style="height:${hourH*24}px"></div>
      </div>
    </div>`;
  container.appendChild(wrap);

  const timeCol = wrap.querySelector('#day-time-col');
  const evCol = wrap.querySelector('#day-events-col');

  for (let h = 0; h < 24; h++) {
    const lbl = document.createElement('div');
    lbl.className = 'time-label';
    lbl.style.top = `${h*hourH + hourH/2}px`;
    lbl.textContent = `${fmt2(h)}:00`;
    timeCol.appendChild(lbl);

    const row = document.createElement('div');
    row.className = 'hour-row';
    row.style.height = `${hourH}px`;
    row.style.top = `${h*hourH}px`;
    row.style.position = 'absolute';
    row.style.left = '0'; row.style.right = '0';
    const half = document.createElement('div');
    half.className = 'half-line';
    row.appendChild(half);
    evCol.appendChild(row);
  }

  evCol.addEventListener('click', e => {
    if (e.target.closest('.cal-event') || e.target.closest('.log-chip')) return;
    const rect = evCol.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const hh = Math.floor(y / hourH);
    const mm = (y % hourH) >= hourH/2 ? 30 : 0;
    openEventModal(null, ds, `${fmt2(hh)}:${fmt2(mm)}`, `${fmt2(Math.min(hh+1,23))}:${fmt2(mm)}`);
  });

  const dayEvents = state.events.filter(ev => ev.date === ds);
  renderEventsInLane(evCol, dayEvents, hourH, true);
  const dayLogs = state.logs.filter(lg => lg.date === ds);
  renderLogsInLane(evCol, dayLogs, hourH);

  // current time line (1Day view)
  const now = new Date();
  if (ds === todayStr()) {
    const minOfDay = now.getHours()*60 + now.getMinutes();
    const topPx = (minOfDay / 60) * hourH;
    const line = document.createElement('div');
    line.className = 'current-time-line';
    line.style.top = `${topPx}px`;
    line.style.left = '0';
    line.style.right = '0';
    evCol.appendChild(line);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const scrollArea = wrap.querySelector('#day-scroll');
      if (scrollArea) scrollArea.scrollTop = hourH * 7;
    });
  });
}

// ─────────────────────────────────────────────
//  MONTHLY VIEW
// ─────────────────────────────────────────────
function renderMonthView(container) {
  const d = parseDate(state.currentDate);
  const y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const today = todayStr();
  const DAY_NAMES = ['月','火','水','木','金','土','日'];

  let startDay = first.getDay(); // 0=Sun
  if (startDay === 0) startDay = 7; // Mon-based
  startDay -= 1; // 0=Mon

  const wrap = document.createElement('div');
  wrap.id = 'month-view';
  wrap.innerHTML = `
    <div class="month-day-labels">
      ${DAY_NAMES.map(n => `<div class="month-day-label">${n}</div>`).join('')}
    </div>
    <div class="month-grid-wrap">
      <div class="month-grid" id="month-grid"></div>
    </div>`;
  container.appendChild(wrap);

  const grid = wrap.querySelector('#month-grid');
  const totalCells = Math.ceil((startDay + last.getDate()) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startDay + 1;
    const cell = document.createElement('div');
    cell.className = 'month-cell';
    const isOther = dayNum < 1 || dayNum > last.getDate();
    const cellDate = new Date(y, m, dayNum);
    const ds = `${cellDate.getFullYear()}-${fmt2(cellDate.getMonth()+1)}-${fmt2(cellDate.getDate())}`;

    if (isOther) {
      cell.classList.add('other-month');
      cell.innerHTML = `<div class="mc-num">${cellDate.getDate()}</div>`;
    } else {
      if (ds === today) cell.classList.add('today');
      const dayEvents = state.events.filter(ev => ev.date === ds);
      const dayLogs = state.logs.filter(lg => lg.date === ds);
      cell.innerHTML = `
        <div class="mc-num">${dayNum}</div>
        <div class="mc-events">
          ${dayLogs.map(lg => {
            const lc = LOG_COLORS[lg.type] || {badge_bg:'rgba(255,255,255,0.1)',badge_text:'#999'};
            return `<div class="mc-event-dot" style="background:${lc.badge_bg};color:${lc.badge_text}">${lg.type} ${lg.time}</div>`;
          }).join('')}
          ${dayEvents.map(ev => {
            const clr = EVENT_COLORS[ev.colorIdx||0];
            return `<div class="mc-event-dot" style="background:${clr.bg};color:${clr.text}">${ev.start} ${ev.title}</div>`;
          }).join('')}
        </div>`;
      cell.addEventListener('click', () => {
        state.currentDate = ds;
        state.view = 'day';
        document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view==='day'));
        renderAll();
      });
    }
    grid.appendChild(cell);
  }
}

// ─────────────────────────────────────────────
//  EVENTS IN LANE
// ─────────────────────────────────────────────
function renderEventsInLane(lane, events, hourH, wide) {
  events.forEach(ev => {
    const startMin = timeToMin(ev.start);
    const endMin = timeToMin(ev.end || ev.start);
    const top = (startMin / 60) * hourH;
    const height = Math.max(hourH * 0.5, ((endMin - startMin) / 60) * hourH);
    const clr = EVENT_COLORS[ev.colorIdx || 0];

    const el = document.createElement('div');
    el.className = 'cal-event';
    el.style.cssText = `
      top:${top}px; height:${height}px;
      background:${clr.bg}; border-left-color:${clr.border};
      color:${clr.text};
    `;
    el.innerHTML = `<div class="ev-title">${ev.title}</div><div class="ev-time">${ev.start}–${ev.end||''}</div>`;
    el.addEventListener('click', e => { e.stopPropagation(); openEventModal(ev); });
    lane.appendChild(el);
  });
}

// ─────────────────────────────────────────────
//  LOGS IN LANE
// ─────────────────────────────────────────────
function renderLogsInLane(lane, logs, hourH) {
  logs.forEach(lg => {
    const min = timeToMin(lg.time);
    const top = (min / 60) * hourH;
    const lc = LOG_COLORS[lg.type] || { dot: '#888', badge_text: '#888' };

    const chip = document.createElement('div');
    chip.className = 'log-chip';
    chip.style.top = `${top - 8}px`;
    chip.innerHTML = `
      <div class="log-chip-dot" style="background:${lc.dot}"></div>
      <span class="log-chip-text" style="color:${lc.badge_text}">${lg.type} ${lg.time}</span>`;
    lane.appendChild(chip);
  });
}

// ─────────────────────────────────────────────
//  EVENT MODAL
// ─────────────────────────────────────────────
let editingEventId = null;

function buildColorSwatches(containerId, selectedIdx, onChange) {
  const cont = $(containerId);
  cont.innerHTML = '';
  EVENT_COLORS.forEach((clr, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === selectedIdx ? ' selected' : '');
    sw.style.background = clr.border;
    sw.title = clr.label;
    sw.onclick = () => {
      cont.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      onChange(i);
    };
    cont.appendChild(sw);
  });
}

let selectedEvColor = 0;
let selectedGoalColor = 0;

function openEventModal(ev, date, startT, endT) {
  editingEventId = ev ? ev.id : null;
  $('event-modal-title').textContent = ev ? '予定を編集' : '予定を追加';
  $('ev-title').value = ev ? ev.title : '';
  $('ev-date').value = ev ? ev.date : (date || state.currentDate);
  $('ev-start').value = ev ? ev.start : (startT || '09:00');
  $('ev-end').value = ev ? (ev.end || '10:00') : (endT || '10:00');
  $('ev-memo').value = ev ? (ev.memo || '') : '';
  selectedEvColor = ev ? (ev.colorIdx || 0) : 0;
  buildColorSwatches('ev-color-swatches', selectedEvColor, i => { selectedEvColor = i; });
  $('ev-delete-btn').classList.toggle('hidden', !ev);
  $('event-modal').classList.remove('hidden');
  $('ev-title').focus();
}
$('ev-cancel-btn').onclick = () => $('event-modal').classList.add('hidden');
$('event-modal').onclick = e => { if (e.target === $('event-modal')) $('event-modal').classList.add('hidden'); };
$('ev-save-btn').onclick = () => {
  const title = $('ev-title').value.trim();
  if (!title) { $('ev-title').focus(); return; }
  if (editingEventId) {
    const ev = state.events.find(e => e.id === editingEventId);
    if (ev) {
      ev.title = title;
      ev.date = $('ev-date').value;
      ev.start = $('ev-start').value;
      ev.end = $('ev-end').value;
      ev.memo = $('ev-memo').value;
      ev.colorIdx = selectedEvColor;
    }
  } else {
    state.events.push({
      id: genId(), title,
      date: $('ev-date').value,
      start: $('ev-start').value,
      end: $('ev-end').value,
      memo: $('ev-memo').value,
      colorIdx: selectedEvColor,
    });
  }
  save();
  $('event-modal').classList.add('hidden');
  renderCalendar();
  showToast(editingEventId ? '予定を更新しました' : '予定を追加しました');
};
$('ev-delete-btn').onclick = () => {
  if (!editingEventId) return;
  state.events = state.events.filter(e => e.id !== editingEventId);
  save(); $('event-modal').classList.add('hidden'); renderCalendar();
  showToast('予定を削除しました');
};
$('add-event-btn').onclick = () => openEventModal(null);

// ─────────────────────────────────────────────
//  GOAL MODAL & RENDER
// ─────────────────────────────────────────────
$('add-goal-btn').onclick = () => {
  $('goal-name-input').value = '';
  selectedGoalColor = 0;
  buildColorSwatches('goal-color-swatches', 0, i => { selectedGoalColor = i; });
  $('goal-modal').classList.remove('hidden');
  $('goal-name-input').focus();
};
$('goal-cancel-btn').onclick = () => $('goal-modal').classList.add('hidden');
$('goal-modal').onclick = e => { if (e.target === $('goal-modal')) $('goal-modal').classList.add('hidden'); };
$('goal-save-btn').onclick = () => {
  const name = $('goal-name-input').value.trim();
  if (!name) return;
  state.goals.push({ id: genId(), name, colorIdx: selectedGoalColor, subtasks: [] });
  save(); $('goal-modal').classList.add('hidden'); renderGoals();
  showToast('ゴールを追加しました');
};

let addingSubtaskToGoalId = null;
$('subtask-cancel-btn').onclick = () => $('subtask-modal').classList.add('hidden');
$('subtask-modal').onclick = e => { if (e.target === $('subtask-modal')) $('subtask-modal').classList.add('hidden'); };
$('subtask-save-btn').onclick = () => {
  const text = $('subtask-input').value.trim();
  if (!text || !addingSubtaskToGoalId) return;
  const goal = state.goals.find(g => g.id === addingSubtaskToGoalId);
  if (goal) { goal.subtasks = goal.subtasks || []; goal.subtasks.push({ id: genId(), text, done: false }); }
  save(); $('subtask-modal').classList.add('hidden'); renderGoals();
};

function renderGoals() {
  const wrap = $('goal-list-wrap');
  wrap.innerHTML = '';
  if (state.goals.length === 0) {
    wrap.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px 4px;">ゴールはまだありません</div>';
    return;
  }
  state.goals.forEach(goal => {
    const clr = EVENT_COLORS[goal.colorIdx || 0];
    const item = document.createElement('div');
    item.className = 'goal-item';
    item.innerHTML = `
      <div class="goal-title-row">
        <div class="goal-color-dot" style="background:${clr.border}"></div>
        <span class="goal-name">${goal.name}</span>
        <span class="goal-chevron">›</span>
        <button class="goal-add-sub" data-gid="${goal.id}" style="font-size:16px;color:var(--text3);padding:0 2px;line-height:1;transition:color .15s">＋</button>
        <button class="goal-del" data-gid="${goal.id}" style="font-size:14px;color:var(--text3);padding:0 2px;transition:color .15s">✕</button>
      </div>
      <div class="goal-subtasks">
        ${(goal.subtasks||[]).map(st => `
          <div class="subtask-row${st.done?' done':''}" data-gid="${goal.id}" data-sid="${st.id}">
            <div class="subtask-check"></div>
            <span class="subtask-label">${st.text}</span>
            <button class="subtask-del" data-gid="${goal.id}" data-sid="${st.id}">✕</button>
          </div>`).join('')}
      </div>`;
    wrap.appendChild(item);

    item.querySelector('.goal-title-row').addEventListener('click', e => {
      if (e.target.closest('.goal-add-sub') || e.target.closest('.goal-del')) return;
      item.classList.toggle('expanded');
    });
    item.querySelector('.goal-add-sub').addEventListener('click', e => {
      e.stopPropagation();
      addingSubtaskToGoalId = goal.id;
      $('subtask-modal-title').textContent = `「${goal.name}」にタスクを追加`;
      $('subtask-input').value = '';
      $('subtask-modal').classList.remove('hidden');
      $('subtask-input').focus();
    });
    item.querySelector('.goal-del').addEventListener('click', e => {
      e.stopPropagation();
      state.goals = state.goals.filter(g => g.id !== goal.id);
      save(); renderGoals(); showToast('ゴールを削除しました');
    });
    item.querySelectorAll('.subtask-row').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.subtask-del')) return;
        const st = (goal.subtasks||[]).find(s => s.id === row.dataset.sid);
        if (st) { st.done = !st.done; save(); renderGoals(); }
      });
    });
    item.querySelectorAll('.subtask-del').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        goal.subtasks = (goal.subtasks||[]).filter(s => s.id !== btn.dataset.sid);
        save(); renderGoals();
      });
    });
  });
}

// ─────────────────────────────────────────────
//  TODO
// ─────────────────────────────────────────────
$('show-todo-form-btn').onclick = () => {
  const form = $('todo-inline-form');
  const isVisible = form.style.display !== 'none';
  form.style.display = isVisible ? 'none' : 'flex';
  if (!isVisible) $('todo-input-text').focus();
};
$('todo-inline-add').onclick = addTodo;
$('todo-input-text').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
function addTodo() {
  const text = $('todo-input-text').value.trim();
  if (!text) return;
  state.todos.push({ id: genId(), text, priority: $('todo-priority-sel').value, done: false, date: todayStr() });
  save(); renderTodos();
  $('todo-input-text').value = '';
  showToast('ToDoを追加しました');
}
function renderTodos() {
  const wrap = $('todo-list');
  wrap.innerHTML = '';
  const active = state.todos.filter(t => !t.done);
  const done = state.todos.filter(t => t.done);
  [...active, ...done].forEach(todo => {
    const item = document.createElement('div');
    item.className = 'todo-item' + (todo.done ? ' done' : '');
    const pBadge = { high:'<span class="priority-badge p-high">高</span>', mid:'<span class="priority-badge p-mid">中</span>', low:'<span class="priority-badge p-low">低</span>' }[todo.priority] || '';
    item.innerHTML = `
      <div class="todo-check"></div>
      <span class="todo-text">${todo.text}</span>
      ${pBadge}
      <button class="todo-del" data-id="${todo.id}">✕</button>`;
    item.addEventListener('click', e => {
      if (e.target.closest('.todo-del')) return;
      todo.done = !todo.done; save(); renderTodos();
    });
    item.querySelector('.todo-del').addEventListener('click', e => {
      e.stopPropagation();
      state.todos = state.todos.filter(t => t.id !== todo.id);
      save(); renderTodos();
    });
    wrap.appendChild(item);
  });
}

// ─────────────────────────────────────────────
//  QUICK LOG
// ─────────────────────────────────────────────
document.querySelectorAll('.ql-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.logtype;
    const time = nowTimeStr();
    const date = todayStr();
    state.logs.push({ id: genId(), type, time, date });
    save();
    renderLogs();
    renderCalendar(); // refresh log chips
    showToast(`${type} ${time} を記録しました`);
  });
});

function renderLogs() {
  const wrap = $('log-list-wrap');
  wrap.innerHTML = '';
  const todayLogs = state.logs
    .filter(lg => lg.date === todayStr())
    .sort((a,b) => a.time.localeCompare(b.time));
  if (todayLogs.length === 0) {
    wrap.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px 4px;">今日のログはまだありません</div>';
    return;
  }
  todayLogs.forEach(lg => {
    const lc = LOG_COLORS[lg.type] || {badge_bg:'rgba(255,255,255,0.1)',badge_text:'#999'};
    const el = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML = `
      <span class="log-time">${lg.time}</span>
      <span class="log-type-badge" style="background:${lc.badge_bg};color:${lc.badge_text}">${lg.type}</span>`;
    wrap.appendChild(el);
  });
}

// ─────────────────────────────────────────────
//  RENDER ALL
// ─────────────────────────────────────────────
function renderAll() {
  updateDateLabel();
  renderCalendar();
  renderGoals();
  renderTodos();
  renderLogs();
}

// init
renderAll();

// current time indicator updater (毎分更新)
setInterval(() => {
  const lines = document.querySelectorAll('.current-time-line');
  if (lines.length === 0) return;
  const now = new Date();
  const hourH = getHourH();
  const minOfDay = now.getHours()*60 + now.getMinutes();
  const topPx = (minOfDay / 60) * hourH;
  lines.forEach(l => { l.style.top = `${topPx}px`; });
}, 60000);

// resize rerender
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderCalendar(), 150);
});
</script>
