<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifePlanner">
<title>LifePlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN TOKENS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg:    #0f1117;
  --bg2:   #161b27;
  --bg3:   #1e2535;
  --bg4:   #252d3d;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text:  #e8eaf0;
  --text2: #8b93a8;
  --text3: #5a6278;
  --accent:      #4f8ef7;
  --accent2:     #3a7ae8;
  --accent-glow: rgba(79,142,247,0.18);
  --green:  #34c97a;
  --green-bg: rgba(52,201,122,0.12);
  --amber:  #f5a623;
  --amber-bg: rgba(245,166,35,0.12);
  --red:    #ff5f5f;
  --red-bg: rgba(255,95,95,0.12);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.12);
  --coral:  #f87171;
  --coral-bg: rgba(248,113,113,0.12);
  --r:  8px;
  --rl: 12px;
  --font:      'Noto Sans JP', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --top-h:  52px;
  --cal-h:  44px;
  --gut-w:  46px;
  --hour-h: 48px;   /* 48×24 = 1152px グリッド高さ */
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button  { font-family: var(--font); cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: var(--font); }

::-webkit-scrollbar       { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   APP SHELL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ── TOP BAR ── */
#top-bar {
  flex: 0 0 var(--top-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  z-index: 100;
  overflow: hidden;
}
#app-title {
  font-weight: 700; font-size: 15px;
  letter-spacing: .06em;
  color: var(--accent);
  font-family: var(--font-mono);
  white-space: nowrap;
  flex-shrink: 0;
}
#date-nav {
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
#date-nav .nav-arrow {
  width: 26px; height: 26px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  color: var(--text2); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
#date-nav .nav-arrow:hover { background: var(--bg4); color: var(--text); }
#date-label {
  min-width: 110px; text-align: center;
  font-size: 13px; font-weight: 500;
}
#today-btn {
  padding: 4px 10px; border-radius: var(--r);
  border: 1px solid var(--border2);
  color: var(--text2); font-size: 12px;
  transition: background .15s;
}
#today-btn:hover { background: var(--bg4); color: var(--text); }

/* quick log */
#quick-log {
  display: flex; align-items: center; gap: 5px;
  margin-left: auto; flex-shrink: 0;
}
#quick-log .ql-label { font-size: 11px; color: var(--text3); }
.ql-btn {
  padding: 4px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  border: 1px solid var(--border2);
  background: var(--bg3);
  white-space: nowrap;
  transition: all .15s;
}
.ql-btn[data-logtype="起床"] { border-color:rgba(245,166,35,.4); color:var(--amber); background:var(--amber-bg); }
.ql-btn[data-logtype="入店"] { border-color:rgba(52,201,122,.4); color:var(--green); background:var(--green-bg); }
.ql-btn[data-logtype="退店"] { border-color:rgba(248,113,113,.4); color:var(--coral); background:var(--coral-bg); }
.ql-btn[data-logtype="帰宅"] { border-color:rgba(167,139,250,.4); color:var(--purple); background:var(--purple-bg); }

/* ── MAIN ── */
#main {
  flex: 1 1 0;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LEFT PANEL (70%) – CALENDAR
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#left-panel {
  flex: 0 0 70%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid var(--border);
}

/* cal toolbar */
#cal-toolbar {
  flex: 0 0 var(--cal-h);
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.view-tabs {
  display: flex;
  background: var(--bg3);
  border-radius: var(--r);
  padding: 2px; gap: 2px;
}
.view-tab {
  padding: 5px 14px; border-radius: calc(var(--r) - 2px);
  font-size: 12px; font-weight: 500; color: var(--text3);
  transition: all .15s;
}
.view-tab.active { background: var(--accent); color: #fff; }
.view-tab:hover:not(.active) { color: var(--text); }
#add-event-btn {
  margin-left: auto;
  padding: 5px 12px; border-radius: var(--r);
  background: var(--accent-glow);
  border: 1px solid rgba(79,142,247,.3);
  color: var(--accent); font-size: 12px; font-weight: 500;
  transition: all .15s;
}
#add-event-btn:hover { background: var(--accent); color: #fff; }

/* cal body – fills remaining height */
#cal-body {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   WEEKLY VIEW
   構造:
   #weekly-view (flex col)
     .wk-header-row (flex, shrink 0)
     .wk-scroll     (flex 1, overflow-y auto)
       .wk-grid     (flex row, height=1152px)
         .wk-gutter (flex 0 0 46px)
         .wk-cols   (flex 1, position relative)
           .wk-lane ×7 (position relative, height 1152px, float left)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#weekly-view {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
}
.wk-header-row {
  flex: 0 0 36px;
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.wk-header-gutter {
  flex: 0 0 var(--gut-w);
  border-right: 1px solid var(--border);
}
.wk-header-cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  font-size: 11px;
  color: var(--text3);
  line-height: 1.2;
  padding: 3px 0;
}
.wk-header-cell:last-child { border-right: none; }
.wk-header-cell .day-num {
  font-size: 15px; font-weight: 700; color: var(--text2);
}
.wk-header-cell.is-today .day-num {
  color: #fff; background: var(--accent);
  border-radius: 50%;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
}
.wk-header-cell.is-today { color: var(--accent); }
.wk-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
/* ★ wk-grid: flex row で gutter + cols を横並び。
   高さを calc(var(--hour-h) * 24) = 1152px に明示。
   Chrome では flex子の高さが親に依存するため必須。 */
.wk-grid {
  display: flex;
  flex-direction: row;
  height: calc(var(--hour-h) * 24);
  min-height: calc(var(--hour-h) * 24);
}
/* 時刻ガター列 */
.wk-gutter {
  flex: 0 0 var(--gut-w);
  height: calc(var(--hour-h) * 24);
  position: relative;
  border-right: 1px solid var(--border);
}
.wk-time-label {
  position: absolute;
  right: 4px;
  font-size: 9px;
  color: var(--text3);
  font-family: var(--font-mono);
  transform: translateY(-50%);
  white-space: nowrap;
  pointer-events: none;
}
/* ★ wk-cols: 7列を横並びにする親。position:relative で赤線の基準。
   display:flex + width:100% で Chrome でも伸びる。 */
.wk-cols {
  flex: 1 1 0;
  display: flex;
  flex-direction: row;
  position: relative;
  height: calc(var(--hour-h) * 24);
}
/* ★ wk-lane: 各曜日列。flex:1 で均等幅。高さを明示。 */
.wk-lane {
  flex: 1 1 0;
  position: relative;
  height: calc(var(--hour-h) * 24);
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.wk-lane:last-child { border-right: none; }
/* 1時間ごとの境界線 */
.wk-hour-line {
  position: absolute;
  left: 0; right: 0;
  height: 0;
  border-top: 1px solid var(--border);
  pointer-events: none;
}
/* 30分ラインは破線 */
.wk-half-line {
  position: absolute;
  left: 0; right: 0;
  height: 0;
  border-top: 1px dashed var(--border);
  pointer-events: none;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   1DAY VIEW
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#day-view {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
}
.dv-header {
  flex: 0 0 32px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  font-size: 12px; color: var(--text2);
}
.dv-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.dv-grid {
  display: flex;
  flex-direction: row;
  height: calc(var(--hour-h) * 24);
  min-height: calc(var(--hour-h) * 24);
}
.dv-gutter {
  flex: 0 0 var(--gut-w);
  height: calc(var(--hour-h) * 24);
  position: relative;
  border-right: 1px solid var(--border);
}
.dv-events {
  flex: 1 1 0;
  position: relative;
  height: calc(var(--hour-h) * 24);
  overflow: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MONTHLY VIEW
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#month-view {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
}
.mv-dow-row {
  flex: 0 0 28px;
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.mv-dow-cell {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text3);
  border-right: 1px solid var(--border);
}
.mv-dow-cell:last-child { border-right: none; }
.mv-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
/* ★ mv-grid: display:flex + flex-wrap でグリッド状に並べる。
   display:grid はChromeで高さが0になるケースがあるため回避。 */
.mv-grid {
  display: flex;
  flex-wrap: wrap;
  min-height: 100%;
}
.mv-cell {
  flex: 0 0 calc(100% / 7);
  min-height: 80px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 4px 6px;
  cursor: pointer;
  transition: background .15s;
  overflow: hidden;
}
.mv-cell:hover { background: var(--bg3); }
.mv-cell.is-today { background: var(--accent-glow); }
.mv-cell-num {
  font-size: 12px; font-weight: 500; color: var(--text2);
  margin-bottom: 3px;
}
.mv-cell.is-today .mv-cell-num {
  color: #fff; background: var(--accent);
  border-radius: 50%;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}
.mv-cell.other-month .mv-cell-num { color: var(--text3); }
.mv-dot {
  font-size: 10px; padding: 1px 4px;
  border-radius: 3px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CURRENT TIME LINE (赤線)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.time-now-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: var(--red);
  z-index: 20;
  pointer-events: none;
}
.time-now-line::before {
  content: '';
  position: absolute;
  left: -4px; top: -3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   EVENTS & LOGS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.cal-event {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: 5px;
  padding: 2px 5px;
  font-size: 10px;
  overflow: hidden;
  cursor: pointer;
  z-index: 5;
  border-left: 3px solid transparent;
}
.cal-event:hover { opacity: .85; }
.cal-event .ev-title { font-weight: 500; }
.cal-event .ev-time  { font-size: 9px; opacity: .7; font-family: var(--font-mono); }
.log-chip {
  position: absolute;
  left: 0; right: 0;
  display: flex; align-items: center; gap: 4px;
  padding: 0 5px;
  z-index: 6;
  pointer-events: none;
}
.log-chip-dot  { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.log-chip-text { font-size: 9px; font-family: var(--font-mono); font-weight: 500; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RIGHT PANEL (30%)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#right-panel {
  flex: 0 0 30%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  background: var(--bg2);
}
.r-section {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 1px solid var(--border);
}
.r-section:last-child { border-bottom: none; }
.r-section-head {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px 7px;
  border-bottom: 1px solid var(--border);
}
.r-section-title {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em; color: var(--text3);
}
.r-add-btn {
  margin-left: auto;
  width: 22px; height: 22px; border-radius: 5px;
  border: 1px solid var(--border2); color: var(--text3);
  font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.r-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.r-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 8px 10px;
  min-height: 0;
}

/* goal */
.goal-item { margin-bottom: 10px; }
.goal-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: var(--r);
  background: var(--bg3); border: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.goal-head:hover { background: var(--bg4); }
.goal-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.goal-name { flex: 1; font-size: 12px; font-weight: 500; }
.goal-chevron { font-size: 10px; color: var(--text3); transition: transform .2s; }
.goal-item.open .goal-chevron { transform: rotate(90deg); }
.goal-subs { display: none; padding: 4px 0 0 16px; }
.goal-item.open .goal-subs { display: block; }
.sub-row {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 6px; border-radius: 5px; cursor: pointer;
  transition: background .15s;
}
.sub-row:hover { background: var(--bg3); }
.sub-check {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1.5px solid var(--border2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.sub-row.done .sub-check { background: var(--green); border-color: var(--green); }
.sub-row.done .sub-check::after { content: '✓'; font-size: 9px; color: #000; }
.sub-label { flex: 1; font-size: 11px; color: var(--text2); }
.sub-row.done .sub-label { text-decoration: line-through; color: var(--text3); }
.sub-del { color: var(--text3); font-size: 13px; opacity: 0; transition: opacity .15s; }
.sub-row:hover .sub-del { opacity: 1; }

/* todo */
.todo-item {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 5px 6px; border-radius: 5px; cursor: pointer;
  transition: background .15s; margin-bottom: 2px;
}
.todo-item:hover { background: var(--bg3); }
.todo-check {
  width: 15px; height: 15px; border-radius: 50%;
  border: 1.5px solid var(--border2); flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.todo-item.done .todo-check { background: var(--green); border-color: var(--green); }
.todo-item.done .todo-check::after { content: '✓'; font-size: 8px; color: #000; }
.todo-text { flex: 1; font-size: 12px; line-height: 1.4; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
.todo-del { color: var(--text3); font-size: 13px; opacity: 0; transition: opacity .15s; }
.todo-item:hover .todo-del { opacity: 1; }
.pbadge { font-size: 9px; padding: 1px 5px; border-radius: 10px; align-self: center; flex-shrink: 0; }
.p-high { background: var(--red-bg);   color: var(--red);   }
.p-mid  { background: var(--amber-bg); color: var(--amber); }
.p-low  { background: var(--green-bg); color: var(--green); }

/* inline form */
.inline-form { display: flex; gap: 6px; padding: 4px 2px; }
.inline-input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); padding: 5px 9px; font-size: 12px; outline: none;
}
.inline-input:focus { border-color: var(--accent); }
.inline-sel {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text2); padding: 5px; font-size: 11px; outline: none;
}
.inline-ok {
  padding: 5px 10px; border-radius: var(--r);
  background: var(--accent); color: #fff; font-size: 12px;
  transition: background .15s;
}
.inline-ok:hover { background: var(--accent2); }

/* log list */
.log-entry { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; margin-bottom: 2px; }
.log-time  { font-size: 11px; font-family: var(--font-mono); color: var(--accent); min-width: 36px; }
.log-badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; }
.empty-msg { font-size: 11px; color: var(--text3); padding: 6px 4px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODALS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.modal-bg.hide { display: none; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--rl); padding: 20px;
  width: 360px; max-width: 95vw;
}
.modal-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
.form-row { margin-bottom: 12px; }
.form-label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.form-input, .form-sel, .form-ta {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); padding: 7px 10px;
  font-size: 13px; outline: none; transition: border .15s;
}
.form-input:focus, .form-sel:focus, .form-ta:focus { border-color: var(--accent); }
.form-sel option { background: var(--bg3); }
.form-ta { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: border .15s;
}
.swatch.sel { border-color: #fff; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn-cancel {
  padding: 6px 14px; border-radius: var(--r);
  border: 1px solid var(--border2); color: var(--text2); font-size: 12px;
  transition: background .15s;
}
.btn-cancel:hover { background: var(--bg3); }
.btn-save {
  padding: 6px 16px; border-radius: var(--r);
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 500;
  transition: background .15s;
}
.btn-save:hover { background: var(--accent2); }
.btn-del {
  padding: 6px 12px; border-radius: var(--r);
  background: var(--red-bg); border: 1px solid rgba(255,95,95,.3);
  color: var(--red); font-size: 12px; transition: all .15s;
}
.btn-del:hover { background: var(--red); color: #fff; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOAST
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 20px; padding: 8px 18px;
  font-size: 12px; z-index: 300; pointer-events: none;
  transition: transform .25s ease;
}
#toast.show { transform: translateX(-50%) translateY(0); }

.hide { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="top-bar">
    <span id="app-title">LifePlanner</span>
    <div id="date-nav">

</div>

<!-- EVENT MODAL -->

<div id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
const $  = id => document.getElementById(id);
const p2 = n  => String(n).padStart(2,'0');

function todayStr() {
  var d = new Date();
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function parseDate(s) {
  var p = s.split('-');
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function dateStr(d) {
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function nowTime() {
  var n = new Date();
  return p2(n.getHours())+':'+p2(n.getMinutes());
}
function timeToMin(t) {
  var p = t.split(':');
  return (+p[0])*60+(+p[1]);
}
function jpDate(d) {
  var w = ['日','月','火','水','木','金','土'];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+w[d.getDay()]+'）';
}
function weekStart(d) {
  // 月曜始まり
  var day = d.getDay();
  var diff = (day === 0) ? -6 : 1 - day;
  var m = new Date(d);
  m.setDate(d.getDate()+diff);
  return m;
}

// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
var HOUR_H = 48; // px per hour

var EV_COLORS = [
  {bg:'#1d5fa4', border:'#4f8ef7', text:'#b5d4f4'},
  {bg:'#1a6b47', border:'#34c97a', text:'#9fe1cb'},
  {bg:'#7a3a8a', border:'#a78bfa', text:'#d4bbfc'},
  {bg:'#8a3a1a', border:'#f87171', text:'#fca5a5'},
  {bg:'#8a5a0a', border:'#f5a623', text:'#fcd34d'},
  {bg:'#1a6a70', border:'#2dd4bf', text:'#99f6e4'},
  {bg:'#3a3a5a', border:'#818cf8', text:'#c7d2fe'},
];
var LOG_COLORS = {
  '起床': {dot:'#f5a623', bbg:'rgba(245,166,35,.15)', btxt:'#f5a623'},
  '入店': {dot:'#34c97a', bbg:'rgba(52,201,122,.15)', btxt:'#34c97a'},
  '退店': {dot:'#f87171', bbg:'rgba(248,113,113,.15)', btxt:'#f87171'},
  '帰宅': {dot:'#a78bfa', bbg:'rgba(167,139,250,.15)', btxt:'#a78bfa'},
};
var DAY_NAMES = ['月','火','水','木','金','土','日'];

// ═══════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════
var LS = {
  get: function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
var ST = {
  view:    'week',
  date:    todayStr(),
  events:  LS.get('lp_events',[]),
  goals:   LS.get('lp_goals',[]),
  todos:   LS.get('lp_todos',[]),
  logs:    LS.get('lp_logs',[]),
};
function save() {
  LS.set('lp_events', ST.events);
  LS.set('lp_goals',  ST.goals);
  LS.set('lp_todos',  ST.todos);
  LS.set('lp_logs',   ST.logs);
}
function uid() { return Math.random().toString(36).slice(2,9); }

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════
var _toastTmr = null;
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(_toastTmr) clearTimeout(_toastTmr);
  _toastTmr = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ═══════════════════════════════════════════
//  DATE NAV
// ═══════════════════════════════════════════
function updateDateLabel() {
  var d = parseDate(ST.date);
  if(ST.view==='day') {
    $('date-label').textContent = jpDate(d);
  } else if(ST.view==='week') {
    var mon = weekStart(d);
    var sun = new Date(mon); sun.setDate(mon.getDate()+6);
    $('date-label').textContent = (mon.getMonth()+1)+'/'+mon.getDate()+' – '+(sun.getMonth()+1)+'/'+sun.getDate();
  } else {
    $('date-label').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月';
  }
}
$('prev-btn').addEventListener('click', function(){ navigate(-1); });
$('next-btn').addEventListener('click', function(){ navigate(1); });
$('today-btn').addEventListener('click', function(){ ST.date=todayStr(); renderAll(); });
function navigate(dir) {
  var d = parseDate(ST.date);
  if(ST.view==='day')   d.setDate(d.getDate()+dir);
  else if(ST.view==='week') d.setDate(d.getDate()+dir*7);
  else d.setMonth(d.getMonth()+dir);
  ST.date = dateStr(d);
  renderAll();
}

// ═══════════════════════════════════════════
//  VIEW TABS
// ═══════════════════════════════════════════
document.querySelectorAll('.view-tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.view-tab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    ST.view = btn.dataset.view;
    updateDateLabel();
    renderCalendar();
  });
});
$('add-event-btn').addEventListener('click', function(){ openEvModal(null); });

// ═══════════════════════════════════════════
//  CALENDAR DISPATCH
// ═══════════════════════════════════════════
function renderCalendar() {
  var body = $('cal-body');
  body.innerHTML = '';
  if(ST.view==='week')       renderWeek(body);
  else if(ST.view==='day')   renderDay(body);
  else                        renderMonth(body);
}

// ═══════════════════════════════════════════
//  HELPER – 時間行を描画
// ═══════════════════════════════════════════
function addHourLines(parent) {
  for(var h=0; h<24; h++) {
    var hr = document.createElement('div');
    hr.className = 'wk-hour-line';
    hr.style.top = (h * HOUR_H) + 'px';
    parent.appendChild(hr);
    if(h > 0) {
      var hl = document.createElement('div');
      hl.className = 'wk-half-line';
      hl.style.top = (h * HOUR_H - HOUR_H/2) + 'px';
      parent.appendChild(hl);
    }
  }
}

// ═══════════════════════════════════════════
//  HELPER – 時刻ラベルを描画
// ═══════════════════════════════════════════
function addTimeLabels(gutter) {
  for(var h=0; h<24; h++) {
    var lbl = document.createElement('div');
    lbl.className = 'wk-time-label';
    lbl.style.top = (h * HOUR_H + HOUR_H/2) + 'px';
    lbl.textContent = p2(h)+':00';
    gutter.appendChild(lbl);
  }
}

// ═══════════════════════════════════════════
//  HELPER – 赤線を描画
// ═══════════════════════════════════════════
function addNowLine(parent) {
  var now = new Date();
  var top = (now.getHours()*60 + now.getMinutes()) / 60 * HOUR_H;
  var line = document.createElement('div');
  line.className = 'time-now-line';
  line.style.top = top + 'px';
  parent.appendChild(line);
}

// ═══════════════════════════════════════════
//  HELPER – イベントを描画
// ═══════════════════════════════════════════
function renderEvents(parent, events) {
  for(var i=0; i<events.length; i++) {
    var ev = events[i];
    var startMin = timeToMin(ev.start);
    var endMin   = ev.end ? timeToMin(ev.end) : startMin + 60;
    var top    = startMin / 60 * HOUR_H;
    var height = Math.max(HOUR_H*0.5, (endMin-startMin)/60*HOUR_H);
    var clr = EV_COLORS[ev.colorIdx || 0];
    var el = document.createElement('div');
    el.className = 'cal-event';
    el.style.top    = top+'px';
    el.style.height = height+'px';
    el.style.background     = clr.bg;
    el.style.borderLeftColor= clr.border;
    el.style.color          = clr.text;
    el.innerHTML = '<div class="ev-title">'+ev.title+'</div><div class="ev-time">'+ev.start+'–'+(ev.end||'')+'</div>';
    (function(e){ el.addEventListener('click',function(ev2){ ev2.stopPropagation(); openEvModal(e); }); })(ev);
    parent.appendChild(el);
  }
}

// ═══════════════════════════════════════════
//  HELPER – ログチップを描画
// ═══════════════════════════════════════════
function renderLogChips(parent, logs) {
  for(var i=0; i<logs.length; i++) {
    var lg = logs[i];
    var min = timeToMin(lg.time);
    var top = min / 60 * HOUR_H;
    var lc  = LOG_COLORS[lg.type] || {dot:'#888', btxt:'#888'};
    var chip = document.createElement('div');
    chip.className = 'log-chip';
    chip.style.top = (top-8)+'px';
    var dot  = document.createElement('div');
    dot.className = 'log-chip-dot';
    dot.style.background = lc.dot;
    var txt  = document.createElement('span');
    txt.className = 'log-chip-text';
    txt.style.color = lc.btxt;
    txt.textContent = lg.type+' '+lg.time;
    chip.appendChild(dot);
    chip.appendChild(txt);
    parent.appendChild(chip);
  }
}

// ═══════════════════════════════════════════
//  WEEKLY VIEW
// ═══════════════════════════════════════════
function renderWeek(container) {
  var d   = parseDate(ST.date);
  var mon = weekStart(d);
  var tds = todayStr();

  // 月〜日の日付配列
  var days = [];
  for(var i=0; i<7; i++) {
    var dd = new Date(mon);
    dd.setDate(mon.getDate()+i);
    days.push(dd);
  }

  // ── ルート ──
  var root = document.createElement('div');
  root.id = 'weekly-view';

  // ── 曜日ヘッダー行 ──
  var headerRow = document.createElement('div');
  headerRow.className = 'wk-header-row';

  var hGutter = document.createElement('div');
  hGutter.className = 'wk-header-gutter';
  headerRow.appendChild(hGutter);

  for(var i=0; i<7; i++) {
    var dd  = days[i];
    var ds  = dateStr(dd);
    var cell = document.createElement('div');
    cell.className = 'wk-header-cell';
    if(ds === tds) cell.classList.add('is-today');
    if(i === 5) cell.style.color = 'var(--accent)'; // 土
    if(i === 6) cell.style.color = 'var(--red)';    // 日
    var numEl = document.createElement('span');
    numEl.className = 'day-num';
    numEl.textContent = dd.getDate();
    var dayEl = document.createElement('span');
    dayEl.textContent = DAY_NAMES[i];
    cell.appendChild(numEl);
    cell.appendChild(dayEl);
    headerRow.appendChild(cell);
  }
  root.appendChild(headerRow);

  // ── スクロールエリア ──
  var scrollArea = document.createElement('div');
  scrollArea.className = 'wk-scroll';
  root.appendChild(scrollArea);

  // ── wk-grid (flex row, 固定高さ) ──
  var grid = document.createElement('div');
  grid.className = 'wk-grid';
  scrollArea.appendChild(grid);

  // ── 時刻ガター ──
  var gutter = document.createElement('div');
  gutter.className = 'wk-gutter';
  addTimeLabels(gutter);
  grid.appendChild(gutter);

  // ── 7列コンテナ (position:relative → 赤線の基準) ──
  var cols = document.createElement('div');
  cols.className = 'wk-cols';
  grid.appendChild(cols);

  // ── 各曜日列 ──
  for(var i=0; i<7; i++) {
    var dd  = days[i];
    var ds  = dateStr(dd);
    var lane = document.createElement('div');
    lane.className = 'wk-lane';
    lane.dataset.date = ds;

    addHourLines(lane);

    // クリックで予定追加
    (function(lane_ds, lane_el){
      lane_el.addEventListener('click', function(e) {
        if(e.target.closest('.cal-event') || e.target.closest('.log-chip')) return;
        var rect = lane_el.getBoundingClientRect();
        var y  = e.clientY - rect.top;
        var hh = Math.min(23, Math.floor(y / HOUR_H));
        var mm = (y % HOUR_H) >= HOUR_H/2 ? 30 : 0;
        openEvModal(null, lane_ds, p2(hh)+':'+p2(mm), p2(Math.min(hh+1,23))+':'+p2(mm));
      });
    })(ds, lane);

    // イベント・ログ
    var evs  = ST.events.filter(function(ev){ return ev.date === ds; });
    var logs = ST.logs.filter(function(lg){ return lg.date === ds; });
    renderEvents(lane, evs);
    renderLogChips(lane, logs);

    cols.appendChild(lane);
  }

  // ── 赤線: cols (position:relative) の中に描画 ──
  // 今日が表示週に含まれる場合のみ
  var todayIdx = -1;
  for(var i=0; i<7; i++) {
    if(dateStr(days[i]) === tds) { todayIdx = i; break; }
  }
  if(todayIdx >= 0) {
    var now = new Date();
    var topPx = (now.getHours()*60 + now.getMinutes()) / 60 * HOUR_H;
    var colW  = 100 / 7;
    var line  = document.createElement('div');
    line.className = 'time-now-line';
    line.style.top   = topPx + 'px';
    line.style.left  = (todayIdx * colW) + '%';
    line.style.right = (100 - (todayIdx+1) * colW) + '%';
    cols.appendChild(line);
  }

  container.appendChild(root);

  // 7時にスクロール
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      scrollArea.scrollTop = HOUR_H * 7;
    });
  });
}

// ═══════════════════════════════════════════
//  1DAY VIEW
// ═══════════════════════════════════════════
function renderDay(container) {
  var ds  = ST.date;
  var d   = parseDate(ds);
  var tds = todayStr();
  var w   = ['日','月','火','水','木','金','土'];

  var root = document.createElement('div');
  root.id = 'day-view';

  var hdr = document.createElement('div');
  hdr.className = 'dv-header';
  hdr.textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+w[d.getDay()]+'）';
  root.appendChild(hdr);

  var scroll = document.createElement('div');
  scroll.className = 'dv-scroll';
  root.appendChild(scroll);

  var grid = document.createElement('div');
  grid.className = 'dv-grid';
  scroll.appendChild(grid);

  var gutter = document.createElement('div');
  gutter.className = 'dv-gutter';
  addTimeLabels(gutter);
  grid.appendChild(gutter);

  var evCol = document.createElement('div');
  evCol.className = 'dv-events';
  addHourLines(evCol);

  // クリックで予定追加
  evCol.addEventListener('click', function(e) {
    if(e.target.closest('.cal-event') || e.target.closest('.log-chip')) return;
    var rect = evCol.getBoundingClientRect();
    var y  = e.clientY - rect.top;
    var hh = Math.min(23, Math.floor(y / HOUR_H));
    var mm = (y % HOUR_H) >= HOUR_H/2 ? 30 : 0;
    openEvModal(null, ds, p2(hh)+':'+p2(mm), p2(Math.min(hh+1,23))+':'+p2(mm));
  });

  var evs  = ST.events.filter(function(ev){ return ev.date === ds; });
  var logs = ST.logs.filter(function(lg){ return lg.date === ds; });
  renderEvents(evCol, evs);
  renderLogChips(evCol, logs);

  // 赤線（今日のみ）
  if(ds === tds) addNowLine(evCol);

  grid.appendChild(evCol);
  container.appendChild(root);

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      scroll.scrollTop = HOUR_H * 7;
    });
  });
}

// ═══════════════════════════════════════════
//  MONTHLY VIEW
// ═══════════════════════════════════════════
function renderMonth(container) {
  var d    = parseDate(ST.date);
  var y    = d.getFullYear();
  var m    = d.getMonth();
  var tds  = todayStr();
  var first= new Date(y, m, 1);
  var last = new Date(y, m+1, 0);

  // 月曜始まり offset (0=月, …, 6=日)
  var startDow = first.getDay(); // 0=Sun
  var offset   = (startDow === 0) ? 6 : startDow - 1;
  var totalCells = Math.ceil((offset + last.getDate()) / 7) * 7;

  var root = document.createElement('div');
  root.id = 'month-view';

  // 曜日ヘッダー
  var dowRow = document.createElement('div');
  dowRow.className = 'mv-dow-row';
  for(var i=0; i<7; i++) {
    var dc = document.createElement('div');
    dc.className = 'mv-dow-cell';
    if(i===5) dc.style.color='var(--accent)';
    if(i===6) dc.style.color='var(--red)';
    dc.textContent = DAY_NAMES[i];
    dowRow.appendChild(dc);
  }
  root.appendChild(dowRow);

  var scroll = document.createElement('div');
  scroll.className = 'mv-scroll';
  root.appendChild(scroll);

  var grid = document.createElement('div');
  grid.className = 'mv-grid';
  scroll.appendChild(grid);

  for(var ci=0; ci<totalCells; ci++) {
    var dayNum  = ci - offset + 1;
    var cellDate= new Date(y, m, dayNum);
    var ds      = dateStr(cellDate);
    var isOther = (dayNum < 1 || dayNum > last.getDate());

    var cell = document.createElement('div');
    cell.className = 'mv-cell';
    if(isOther)    cell.classList.add('other-month');
    if(ds === tds) cell.classList.add('is-today');

    var numEl = document.createElement('div');
    numEl.className = 'mv-cell-num';
    numEl.textContent = cellDate.getDate();
    cell.appendChild(numEl);

    if(!isOther) {
      // ログ
      var logs = ST.logs.filter(function(lg){ return lg.date === ds; });
      for(var li=0; li<logs.length; li++) {
        var lg = logs[li];
        var lc = LOG_COLORS[lg.type] || {bbg:'rgba(255,255,255,.1)', btxt:'#999'};
        var dot = document.createElement('div');
        dot.className = 'mv-dot';
        dot.style.background = lc.bbg;
        dot.style.color = lc.btxt;
        dot.textContent = lg.type+' '+lg.time;
        cell.appendChild(dot);
      }
      // イベント
      var evs = ST.events.filter(function(ev){ return ev.date === ds; });
      for(var ei=0; ei<evs.length; ei++) {
        var ev  = evs[ei];
        var clr = EV_COLORS[ev.colorIdx || 0];
        var dot = document.createElement('div');
        dot.className = 'mv-dot';
        dot.style.background = clr.bg;
        dot.style.color      = clr.text;
        dot.textContent = ev.start+' '+ev.title;
        cell.appendChild(dot);
      }
      // クリックで1Dayへ
      (function(ds_){ 
        cell.addEventListener('click', function() {
          ST.date = ds_;
          ST.view = 'day';
          document.querySelectorAll('.view-tab').forEach(function(b){
            b.classList.toggle('active', b.dataset.view==='day');
          });
          updateDateLabel();
          renderCalendar();
        });
      })(ds);
    }

    grid.appendChild(cell);
  }

  container.appendChild(root);
}

// ═══════════════════════════════════════════
//  EVENT MODAL
// ═══════════════════════════════════════════
var _editEvId  = null;
var _selEvClr  = 0;
var _selGlClr  = 0;
var _editSubGid= null;

function buildSwatches(containerId, selIdx, onPick) {
  var cont = $(containerId);
  cont.innerHTML = '';
  for(var i=0; i<EV_COLORS.length; i++) {
    (function(idx){
      var sw = document.createElement('div');
      sw.className = 'swatch' + (idx===selIdx?' sel':'');
      sw.style.background = EV_COLORS[idx].border;
      sw.addEventListener('click', function(){
        cont.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
        sw.classList.add('sel');
        onPick(idx);
      });
      cont.appendChild(sw);
    })(i);
  }
}

function openEvModal(ev, date, startT, endT) {
  _editEvId = ev ? ev.id : null;
  _selEvClr = ev ? (ev.colorIdx||0) : 0;
  $('ev-modal-title').textContent = ev ? '予定を編集' : '予定を追加';
  $('ev-title').value  = ev ? ev.title  : '';
  $('ev-date').value   = ev ? ev.date   : (date || ST.date);
  $('ev-start').value  = ev ? ev.start  : (startT || '09:00');
  $('ev-end').value    = ev ? (ev.end||'10:00') : (endT || '10:00');
  $('ev-memo').value   = ev ? (ev.memo||'') : '';
  buildSwatches('ev-swatches', _selEvClr, function(i){ _selEvClr=i; });
  $('ev-del-btn').classList.toggle('hide', !ev);
  $('ev-modal').classList.remove('hide');
  $('ev-title').focus();
}
$('ev-cancel-btn').addEventListener('click', function(){ $('ev-modal').classList.add('hide'); });
$('ev-modal').addEventListener('click', function(e){ if(e.target===$('ev-modal')) $('ev-modal').classList.add('hide'); });
$('ev-save-btn').addEventListener('click', function() {
  var title = $('ev-title').value.trim();
  if(!title){ $('ev-title').focus(); return; }
  if(_editEvId) {
    var ev = ST.events.find(function(e){ return e.id===_editEvId; });
    if(ev){ ev.title=$('ev-title').value; ev.date=$('ev-date').value; ev.start=$('ev-start').value; ev.end=$('ev-end').value; ev.memo=$('ev-memo').value; ev.colorIdx=_selEvClr; }
  } else {
    ST.events.push({id:uid(), title:title, date:$('ev-date').value, start:$('ev-start').value, end:$('ev-end').value, memo:$('ev-memo').value, colorIdx:_selEvClr});
  }
  save(); $('ev-modal').classList.add('hide'); renderCalendar();
  toast(_editEvId?'予定を更新しました':'予定を追加しました');
});
$('ev-del-btn').addEventListener('click', function() {
  if(!_editEvId) return;
  ST.events = ST.events.filter(function(e){ return e.id!==_editEvId; });
  save(); $('ev-modal').classList.add('hide'); renderCalendar();
  toast('予定を削除しました');
});

// ═══════════════════════════════════════════
//  GOAL
// ═══════════════════════════════════════════
$('btn-add-goal').addEventListener('click', function() {
  $('goal-name-in').value = '';
  _selGlClr = 0;
  buildSwatches('goal-swatches', 0, function(i){ _selGlClr=i; });
  $('goal-modal').classList.remove('hide');
  $('goal-name-in').focus();
});
$('goal-cancel-btn').addEventListener('click', function(){ $('goal-modal').classList.add('hide'); });
$('goal-modal').addEventListener('click', function(e){ if(e.target===$('goal-modal')) $('goal-modal').classList.add('hide'); });
$('goal-save-btn').addEventListener('click', function() {
  var name = $('goal-name-in').value.trim();
  if(!name) return;
  ST.goals.push({id:uid(), name:name, colorIdx:_selGlClr, subtasks:[]});
  save(); $('goal-modal').classList.add('hide'); renderGoals();
  toast('ゴールを追加しました');
});

$('sub-cancel-btn').addEventListener('click', function(){ $('sub-modal').classList.add('hide'); });
$('sub-modal').addEventListener('click', function(e){ if(e.target===$('sub-modal')) $('sub-modal').classList.add('hide'); });
$('sub-save-btn').addEventListener('click', function() {
  var text = $('sub-text-in').value.trim();
  if(!text || !_editSubGid) return;
  var g = ST.goals.find(function(g){ return g.id===_editSubGid; });
  if(g){ g.subtasks = g.subtasks||[]; g.subtasks.push({id:uid(), text:text, done:false}); }
  save(); $('sub-modal').classList.add('hide'); renderGoals();
});

function renderGoals() {
  var wrap = $('goal-list');
  wrap.innerHTML = '';
  if(ST.goals.length === 0) {
    var em = document.createElement('div');
    em.className = 'empty-msg';
    em.textContent = 'ゴールはまだありません';
    wrap.appendChild(em);
    return;
  }
  ST.goals.forEach(function(goal) {
    var clr  = EV_COLORS[goal.colorIdx||0];
    var item = document.createElement('div');
    item.className = 'goal-item';

    var head = document.createElement('div');
    head.className = 'goal-head';

    var dot = document.createElement('div');
    dot.className = 'goal-dot';
    dot.style.background = clr.border;

    var name = document.createElement('span');
    name.className = 'goal-name';
    name.textContent = goal.name;

    var chev = document.createElement('span');
    chev.className = 'goal-chevron';
    chev.textContent = '›';

    var addSub = document.createElement('button');
    addSub.textContent = '＋';
    addSub.style.cssText = 'font-size:15px;color:var(--text3);padding:0 2px;';

    var delGoal = document.createElement('button');
    delGoal.textContent = '✕';
    delGoal.style.cssText = 'font-size:13px;color:var(--text3);padding:0 2px;';

    head.appendChild(dot);
    head.appendChild(name);
    head.appendChild(chev);
    head.appendChild(addSub);
    head.appendChild(delGoal);
    item.appendChild(head);

    var subs = document.createElement('div');
    subs.className = 'goal-subs';
    (goal.subtasks||[]).forEach(function(st) {
      var row = document.createElement('div');
      row.className = 'sub-row' + (st.done?' done':'');
      var chk = document.createElement('div');
      chk.className = 'sub-check';
      var lbl = document.createElement('span');
      lbl.className = 'sub-label';
      lbl.textContent = st.text;
      var del = document.createElement('button');
      del.className = 'sub-del';
      del.textContent = '✕';
      row.appendChild(chk); row.appendChild(lbl); row.appendChild(del);
      subs.appendChild(row);

      row.addEventListener('click', function(e) {
        if(e.target === del) return;
        st.done = !st.done; save(); renderGoals();
      });
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        goal.subtasks = goal.subtasks.filter(function(s){ return s.id!==st.id; });
        save(); renderGoals();
      });
    });
    item.appendChild(subs);

    head.addEventListener('click', function(e) {
      if(e.target===addSub || e.target===delGoal) return;
      item.classList.toggle('open');
    });
    addSub.addEventListener('click', function(e) {
      e.stopPropagation();
      _editSubGid = goal.id;
      $('sub-modal-title').textContent = '「'+goal.name+'」にタスクを追加';
      $('sub-text-in').value = '';
      $('sub-modal').classList.remove('hide');
      $('sub-text-in').focus();
    });
    delGoal.addEventListener('click', function(e) {
      e.stopPropagation();
      ST.goals = ST.goals.filter(function(g){ return g.id!==goal.id; });
      save(); renderGoals(); toast('ゴールを削除しました');
    });

    wrap.appendChild(item);
  });
}

// ═══════════════════════════════════════════
//  TODO
// ═══════════════════════════════════════════
$('btn-show-todo-form').addEventListener('click', function() {
  var f = $('todo-form');
  f.classList.toggle('hide');
  if(!f.classList.contains('hide')) $('todo-text-in').focus();
});
$('todo-add-ok').addEventListener('click', addTodo);
$('todo-text-in').addEventListener('keydown', function(e){ if(e.key==='Enter') addTodo(); });
function addTodo() {
  var text = $('todo-text-in').value.trim();
  if(!text) return;
  ST.todos.push({id:uid(), text:text, priority:$('todo-pri-sel').value, done:false, date:todayStr()});
  save(); renderTodos();
  $('todo-text-in').value = '';
  toast('ToDoを追加しました');
}
function renderTodos() {
  var wrap = $('todo-list');
  wrap.innerHTML = '';
  var active = ST.todos.filter(function(t){ return !t.done; });
  var done   = ST.todos.filter(function(t){ return  t.done; });
  var all    = active.concat(done);
  all.forEach(function(todo) {
    var item = document.createElement('div');
    item.className = 'todo-item' + (todo.done?' done':'');
    var chk  = document.createElement('div'); chk.className  = 'todo-check';
    var txt  = document.createElement('span'); txt.className  = 'todo-text'; txt.textContent = todo.text;
    var pbg  = {high:'p-high',mid:'p-mid',low:'p-low'}[todo.priority]||'p-mid';
    var plab = {high:'高',mid:'中',low:'低'}[todo.priority]||'中';
    var pb   = document.createElement('span'); pb.className = 'pbadge '+pbg; pb.textContent = plab;
    var del  = document.createElement('button'); del.className = 'todo-del'; del.textContent = '✕';
    item.appendChild(chk); item.appendChild(txt); item.appendChild(pb); item.appendChild(del);
    item.addEventListener('click', function(e) {
      if(e.target===del) return;
      todo.done = !todo.done; save(); renderTodos();
    });
    del.addEventListener('click', function(e) {
      e.stopPropagation();
      ST.todos = ST.todos.filter(function(t){ return t.id!==todo.id; });
      save(); renderTodos();
    });
    wrap.appendChild(item);
  });
}

// ═══════════════════════════════════════════
//  QUICK LOG
// ═══════════════════════════════════════════
document.querySelectorAll('.ql-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var type = btn.dataset.logtype;
    var time = nowTime();
    var date = todayStr();
    ST.logs.push({id:uid(), type:type, time:time, date:date});
    save(); renderLogs(); renderCalendar();
    toast(type+' '+time+' を記録しました');
  });
});

function renderLogs() {
  var wrap = $('log-list');
  wrap.innerHTML = '';
  var tds  = todayStr();
  var logs = ST.logs.filter(function(lg){ return lg.date===tds; });
  logs.sort(function(a,b){ return a.time.localeCompare(b.time); });
  if(logs.length === 0) {
    var em = document.createElement('div');
    em.className = 'empty-msg';
    em.textContent = '今日のログはまだありません';
    wrap.appendChild(em);
    return;
  }
  logs.forEach(function(lg) {
    var lc  = LOG_COLORS[lg.type] || {bbg:'rgba(255,255,255,.1)',btxt:'#999'};
    var row = document.createElement('div');
    row.className = 'log-entry';
    var t   = document.createElement('span'); t.className='log-time'; t.textContent=lg.time;
    var b   = document.createElement('span'); b.className='log-badge'; b.textContent=lg.type;
    b.style.background = lc.bbg; b.style.color = lc.btxt;
    row.appendChild(t); row.appendChild(b);
    wrap.appendChild(row);
  });
}

// ═══════════════════════════════════════════
//  RENDER ALL
// ═══════════════════════════════════════════
function renderAll() {
  updateDateLabel();
  renderCalendar();
  renderGoals();
  renderTodos();
  renderLogs();
}

// ── 初期化 ──
renderAll();

// ── 赤線を毎分更新 ──
setInterval(function() {
  var lines = document.querySelectorAll('.time-now-line');
  if(!lines.length) return;
  var now  = new Date();
  var top  = (now.getHours()*60 + now.getMinutes()) / 60 * HOUR_H;
  lines.forEach(function(l){ l.style.top = top+'px'; });
}, 60000);

// ── リサイズ時に再描画（必要最小限） ──
var _rsz;
window.addEventListener('resize', function(){
  clearTimeout(_rsz);
  _rsz = setTimeout(renderCalendar, 200);
});
</script>
